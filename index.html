<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orvex - Global Tap to Earn Adventure</title>
    
    <script src='//libtl.com/sdk.js' data-zone='10476542' data-sdk='show_10476542'></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- COPY PROTECTION & GLOBAL STYLES --- */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            
            /* Anti-Copy / Anti-Select Styles */
            -webkit-user-select: none; /* Safari/Chrome */
            -moz-user-select: none;    /* Firefox */
            -ms-user-select: none;     /* IE/Edge */
            user-select: none;         /* Standard */
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        /* --- ADVANCED COSMIC GALAXY THEME --- */
        :root {
            --primary-bg: linear-gradient(135deg, #0c0c2e 0%, #1a1a3d 50%, #2d2d5f 100%);
            --secondary-bg: linear-gradient(135deg, #1e1e3f 0%, #2a2a5a 100%);
            --accent-primary: #00d4ff;
            --accent-secondary: #7c3aed;
            --accent-glow: #00d4ff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(0, 212, 255, 0.2);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-accent: #00d4ff;
            --btn-primary: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            --btn-secondary: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
            --btn-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --btn-warning: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --shadow-primary: 0 20px 40px rgba(0, 212, 255, 0.1);
            --shadow-glow: 0 0 20px rgba(0, 212, 255, 0.3);
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.3);
            --progress-bg: rgba(255, 255, 255, 0.1);
            --progress-fill: linear-gradient(90deg, #00d4ff, #7c3aed);
            --notification-success: linear-gradient(135deg, #10b981, #059669);
            --notification-info: linear-gradient(135deg, #00d4ff, #0099cc);
            --star-color: rgba(255, 255, 255, 0.8);
            --nebula-color: rgba(124, 58, 237, 0.1);
        }

        body.dark-theme {
            --primary-bg: linear-gradient(135deg, #000000 0%, #1a0000 50%, #2d0000 100%);
            --secondary-bg: linear-gradient(135deg, #0a0000 0%, #1a0000 100%);
            --accent-primary: #ff6b6b;
            --accent-secondary: #ffd93d;
            --accent-glow: #ff6b6b;
            --card-bg: rgba(0, 0, 0, 0.7);
            --glass-bg: rgba(0, 0, 0, 0.5);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --text-accent: #ff6b6b;
            --btn-primary: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            --btn-secondary: linear-gradient(135deg, #ffd93d 0%, #fbbf24 100%);
            --shadow-primary: 0 20px 40px rgba(255, 107, 107, 0.1);
            --shadow-glow: 0 0 20px rgba(255, 107, 107, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: all 0.5s ease;
            cursor: default;
        }

        /* Cosmic Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, var(--star-color), transparent),
                radial-gradient(2px 2px at 40px 70px, var(--star-color), transparent),
                radial-gradient(1px 1px at 90px 40px, var(--star-color), transparent),
                radial-gradient(1px 1px at 130px 80px, var(--star-color), transparent),
                radial-gradient(2px 2px at 160px 30px, var(--star-color), transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: stars 20s linear infinite;
            z-index: -2;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes stars {
            from { transform: translateY(0px); }
            to { transform: translateY(-200px); }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--nebula-color);
            animation: nebula 30s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes nebula {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.1); }
        }

        .container { 
            max-width: 420px; 
            margin: auto; 
            padding: 50px 10px 100px 10px; 
            position: relative;
            z-index: 1;
        } 

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            padding: 10px 15px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--btn-primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle-btn,
        .info-btn {
            width: 40px; 
            height: 40px; 
            border-radius: 50%;
            border: 2px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-card);
        }

        .theme-toggle-btn:hover,
        .info-btn:hover { 
            transform: scale(1.1); 
            box-shadow: var(--shadow-glow);
            border-color: var(--accent-primary);
        }

        .info-btn i {
            color: var(--text-primary);
        }

        /* Page Transitions */
        .page { 
            display: none; 
            animation: slideInUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
        }
        .page.active { display: block; }
        
        @keyframes slideInUp {
            from { 
                opacity: 0; 
                transform: translateY(50px) scale(0.95); 
            } 
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            } 
        }

        /* Premium Balance Card */
        .balance-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px 15px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-card);
            text-align: center;
            border: 1px solid var(--card-border);
            position: relative;
            overflow: hidden;
            transition: none;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--progress-fill);
            border-radius: 20px 20px 0 0;
        }

        .balance-card::after {
            content: '';
            position: absolute;
            bottom: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.05) 0%, transparent 70%);
            animation: orbit 8s linear infinite;
            pointer-events: none;
        }

        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(50px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(50px) rotate(-360deg); }
        }

        .balance-card h3 { 
            font-family: 'Orbitron', monospace;
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            opacity: 0.8; 
            margin-bottom: 10px; 
            font-weight: 700;
            color: var(--text-accent);
        }

        .balance-card .amount { 
            font-family: 'Orbitron', monospace;
            font-size: 36px; 
            font-weight: 900; 
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
            text-shadow: none;
            animation: coinGlow 2s ease-in-out infinite alternate;
        }

        @keyframes coinGlow {
            from { filter: drop-shadow(0 0 10px var(--accent-glow)); }
            to { filter: drop-shadow(0 0 20px var(--accent-glow)); }
        }

        /* Main Cards */
        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 25px 20px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-card);
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            transition: none;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), var(--accent-secondary), transparent);
        }

        .main-card h2 { 
            font-family: 'Orbitron', monospace;
            font-size: 20px; 
            font-weight: 900; 
            margin-bottom: 15px; 
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 15px 10px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            transition: none;
            position: relative;
            overflow: hidden;
        }

        .stat-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: var(--progress-fill);
        }

        .stat-item span { 
            display: block; 
            font-family: 'Orbitron', monospace;
            font-size: 24px; 
            font-weight: 900; 
            color: var(--accent-primary);
            margin-bottom: 5px;
        }

        .stat-item label { 
            font-size: 11px; 
            opacity: 0.7; 
            font-weight: 600; 
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Premium Buttons */
        .premium-btn {
            width: 100%;
            height: 60px;
            font-size: 18px;
            font-weight: 800;
            border: none;
            border-radius: 20px;
            color: white;
            background: var(--btn-primary);
            cursor: pointer;
            box-shadow: var(--shadow-primary);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            font-family: 'Orbitron', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 1;
        }

        .premium-btn:hover { 
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 25px 50px rgba(0, 212, 255, 0.3);
        }

        .premium-btn:active { 
            transform: scale(0.98); 
        }

        .back-btn {
            width: 100%;
            height: 60px;
            font-size: 18px;
            font-weight: 800;
            border: none;
            border-radius: 20px;
            color: white;
            background: var(--btn-secondary);
            cursor: pointer;
            box-shadow: var(--shadow-primary);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-family: 'Orbitron', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 1;
        }

        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            display: flex;
            padding: 10px;
            border-radius: 25px;
            box-shadow: var(--shadow-card);
            z-index: 1000;
            border: 1px solid var(--glass-border);
            gap: 6px;
        }

        /* Notification */
        #notification {
            position: fixed;
            top: 60px; 
            left: 50%; 
            transform: translateX(-50%) translateY(-100px);
            background: var(--notification-info);
            color: white; 
            padding: 12px 30px; 
            border-radius: 40px;
            font-weight: 700; 
            z-index: 10001; 
            transition: all 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            box-shadow: var(--shadow-primary);
            max-width: 85%;
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .notification-show { 
            transform: translateX(-50%) translateY(0) !important; 
            animation: notificationPop 0.3s ease;
        }

        @keyframes notificationPop {
            0% { transform: translateX(-50%) translateY(-100px) scale(0.8); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
        }

        .notification-hide {
            transform: translateX(-50%) translateY(-100px) !important;
            opacity: 0;
        }

        /* Splash Screen */
        #splashScreen {
            position: fixed; 
            inset: 0; 
            background: var(--primary-bg);
            z-index: 99999; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .splash-title { 
            font-family: 'Orbitron', monospace;
            font-size: 50px; 
            font-weight: 900; 
            color: var(--accent-primary);
            margin-bottom: 25px;
            animation: epicEntrance 2s ease-out;
            text-shadow: 0 0 30px var(--accent-glow);
            letter-spacing: 4px;
        }

        @keyframes epicEntrance {
            0% { opacity: 0; transform: scale(0.5) rotateX(90deg) translateY(100px); }
            50% { opacity: 1; transform: scale(1.1) rotateX(0deg) translateY(0); }
            100% { opacity: 1; transform: scale(1) rotateX(0deg) translateY(0); }
        }

        .splash-loader {
            width: 200px; height: 6px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 8px; overflow: hidden; 
            position: relative;
        }

        .splash-fill { 
            height: 100%; width: 0%; 
            background: var(--progress-fill);
            animation: loadProgress 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            position: relative; border-radius: 6px;
        }

        @keyframes loadProgress { to { width: 100%; } }

        #splashScreen.fade-out { opacity: 0; transform: scale(1.05); }

    </style>
</head>
<body id="body">

    <div id="splashScreen">
        <div class="splash-title">ORVEX CITY</div>
        <div class="splash-subtitle" style="color:var(--text-muted); margin-top:15px;">Tap to Earn Adventure</div>
        <div class="splash-loader" style="margin-top:20px;">
            <div class="splash-fill"></div>
        </div>
    </div>

    <div id="notification">
        <span id="notificationText"></span>
    </div>

    <div class="container">
        <div class="header">
            <div class="status-indicator">
                <i class="fas fa-signal"></i>
                <span>Season 1 Ended</span>
            </div>
            <div class="header-right">
                <button class="theme-toggle-btn" onclick="toggleTheme()">
                    <span id="themeIcon">🌙</span>
                </button>
                <button class="info-btn" onclick="showInfoPage()">
                    <i class="fas fa-info-circle"></i>
                </button>
            </div>
        </div>

        <div id="airdropPage" class="page active">
            <div class="main-card">
                <h1 style="font-family: 'Orbitron', monospace; color: var(--accent-primary); text-align: center; font-size: 26px; margin-bottom: 10px;">🌟 AIRDROP SEASON 1 🌟</h1>
                <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px; font-size:13px;">The snapshot has been successfully taken.</p>

                <div id="eligibilityContainer"></div>
            </div>
        </div>

        <div id="homePage" class="page">...</div>
        <div id="cityPage" class="page">...</div>
        <div id="tasksPage" class="page">...</div>
        <div id="codePage" class="page">...</div>
        <div id="listingPage" class="page">...</div>

        <div id="infoPage" class="page">
            <div class="main-card" style="text-align:left;">
                <h2 style="font-size:20px; text-align:center; margin-bottom:20px;"><i class="fas fa-info-circle"></i> Info</h2>
                <p style="font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px;">
                    Season 1 of Orvex has officially ended. Airdrop eligibility depends on reaching at least City Level 50. 
                    <br><br>Wait for Season 2 to continue your adventure!
                </p>
                <button class="back-btn" onclick="showPage('airdropPage', null)">Back to Airdrop</button>
            </div>
        </div>
    </div>

    <div class="navigation" style="display: none !important;">
        </div>

    <script>
        // --- SECURITY & ANTI-COPY SYSTEM ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('selectstart', event => event.preventDefault());
        document.addEventListener('dragstart', event => event.preventDefault());
        
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 'c' || e.key === 'C')) {
                e.preventDefault();
            }
        });

        // --- ADVANCED DATA STORAGE ---
        function safeGet(k, d = 0) { 
            try { 
                const item = localStorage.getItem(k);
                return item ? JSON.parse(item) : d; 
            } catch(e) { return d; } 
        }

        function safeSet(k, v) { 
            try { localStorage.setItem(k, JSON.stringify(v)); return true; } 
            catch(e) { return false; } 
        }

        // --- GLOBAL GAME STATE (Mövcud Məlumatlar Çəkilir) ---
        let coins = parseFloat(safeGet('coins', 0)) || 0;
        let upgradeLevel = Math.max(1, parseInt(safeGet('upgradeLevel', 1)) || 1);
        
        // Airdrop Dəyişənləri
        let airdropConverted = safeGet('airdropConverted', false);
        let savedTonWallet = safeGet('savedTonWallet', '');

        function formatNumber(num) {
            return num.toLocaleString('en-US');
        }

        // --- THEME SYSTEM ---
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            const icon = document.getElementById('themeIcon');
            icon.textContent = isDark ? '🔆' : '🌙';
            safeSet('theme', isDark ? 'dark' : 'light');
            
            document.body.style.transition = 'all 0.6s ease';
            setTimeout(() => { document.body.style.transition = ''; }, 600);
        }

        // --- NOTIFICATION SYSTEM ---
        function showNotification(msg, duration = 2000, type = 'info') { 
            const notificationEl = document.getElementById('notification');
            const textEl = document.getElementById('notificationText');
            
            if (!notificationEl || !textEl) return;
            if (window.notificationTimeout) clearTimeout(window.notificationTimeout);

            textEl.textContent = msg;
            notificationEl.style.background = type === 'success' ? 'var(--notification-success)' : 
                                              type === 'error' ? 'rgba(239, 68, 68, 0.9)' : 'var(--notification-info)';
            
            notificationEl.classList.remove('notification-hide');
            notificationEl.classList.add('notification-show');

            window.notificationTimeout = setTimeout(() => {
                notificationEl.classList.remove('notification-show');
                notificationEl.classList.add('notification-hide');
            }, duration);
        }

        // --- YENİ: AIRDROP SİSTEMİ BAŞLADILMASI ---
        function initAirdrop() {
            // Səhifələri yox edirik və yalnız Airdrop səhifəsini aktiv edirik
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('airdropPage').classList.add('active');

            // Balansın 100-ə bölünərək (2 sıfır silinərək) hesablanması (Yalnız 1 dəfə!)
            if (!airdropConverted) {
                coins = Math.floor(coins / 100);
                safeSet('coins', coins);
                safeSet('airdropConverted', true);
            }

            const container = document.getElementById('eligibilityContainer');

            // Şərt: Level 50 və üzəri
            if (upgradeLevel >= 50) {
                let html = `
                    <div class="balance-card" style="margin-bottom: 20px;">
                        <h3>Season 1 Airdrop Allocation</h3>
                        <div class="amount">${formatNumber(coins)} <span style="font-size: 14px;">$ORVEX</span></div>
                    </div>
                    
                    <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px;">
                        <h3 style="color: #10b981; margin-bottom: 10px; font-family: 'Orbitron', monospace;">🎉 Congratulations!</h3>
                        <p style="font-size: 13px; color: var(--text-secondary);">You reached Level ${upgradeLevel} and successfully qualified for the Season 1 Airdrop!</p>
                    </div>
                `;

                if (savedTonWallet) {
                    // Cüzdan artıq yadda saxlanılıb
                    html += `
                        <div style="background: var(--glass-bg); padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); text-align: center; margin-bottom: 20px;">
                            <span style="display:block; margin-bottom: 8px; color: var(--text-muted); font-size: 12px; text-transform: uppercase; font-weight: bold;">Saved TON Wallet:</span>
                            <strong style="color: var(--accent-primary); font-family: monospace; font-size: 14px; word-break: break-all;">${savedTonWallet}</strong>
                        </div>
                        
                        <a href="https://t.me/orvex_support" target="_blank" class="premium-btn" style="display:flex; align-items:center; justify-content:center; text-decoration:none; margin-top: 15px; background: var(--btn-primary);">
                            <i class="fab fa-telegram" style="margin-right: 8px; font-size: 20px;"></i> Contact Support
                        </a>
                        
                        <div style="margin-top: 15px; font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.5;">
                            ⚠️ <strong style="color: white;">CRITICAL STEP:</strong> Take a screenshot of this page and send it along with your TON Wallet Address to <strong>@orvex_support</strong> on Telegram to claim your tokens.
                        </div>
                    `;
                } else {
                    // Cüzdan tələb olunur
                    html += `
                        <div style="margin-top: 20px; text-align: left;">
                            <label style="font-size: 12px; color: var(--accent-primary); font-weight: bold; margin-bottom: 8px; display: block; text-transform: uppercase;">TON Network Wallet Address</label>
                            <input type="text" id="tonInput" placeholder="UQ... Enter TON address" style="width:100%; padding:15px; margin-bottom:10px; border-radius:15px; border:1px solid var(--accent-primary); background:var(--glass-bg); color:white; font-family: monospace; font-size: 14px; outline: none;">
                            <p style="font-size: 11px; color: #ef4444; margin-bottom: 15px; text-align: center; font-weight: bold;">⚠️ Make sure it's a valid TON address. This cannot be changed later!</p>
                            <button onclick="saveWalletAddress()" class="premium-btn">Save Wallet</button>
                        </div>
                    `;
                }
                container.innerHTML = html;

            } else {
                // Şərt ödənməyibsə (Level 50-dən aşağı)
                container.innerHTML = `
                    <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; padding: 25px 20px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2);">
                        <i class="fas fa-lock" style="font-size: 45px; color: #ef4444; margin-bottom: 15px;"></i>
                        <h3 style="color: #ef4444; margin-bottom: 12px; font-family: 'Orbitron', monospace; font-size: 20px;">Not Eligible</h3>
                        <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.5;">You reached <strong>Level ${upgradeLevel}</strong>. City Level 50 was required to qualify for the Season 1 Airdrop.</p>
                        <p style="font-size: 15px; color: var(--accent-primary); font-weight: bold; font-family: 'Orbitron', monospace;">Get ready for Season 2!</p>
                    </div>
                `;
            }
        }

        function saveWalletAddress() {
            const input = document.getElementById('tonInput').value.trim();
            if(input.length < 15) { 
                showNotification("❌ Please enter a valid TON wallet address!", 3000, 'error');
                return;
            }
            safeSet('savedTonWallet', input);
            savedTonWallet = input;
            showNotification("✅ Wallet address saved successfully!", 2000, 'success');
            initAirdrop(); // Ekrani yeniləyir
        }

        // Naviqasiya idarəetməsi (sadəcə İnfo və Airdrop səhifələri arasında)
        function showPage(pageId, btnElement) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            const targetPage = document.getElementById(pageId);
            if (targetPage) targetPage.classList.add('active');
        }
        function showInfoPage() { showPage('infoPage', null); }

        // --- İLKİN YÜKLƏNMƏ ---
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = safeGet('theme', 'light');
            if (savedTheme === 'dark') { toggleTheme(); }
            
            // Bütün sistemi dayandırıb yalnız Airdrop-u aktiv edirik
            initAirdrop();
        });

        // Splash Screen (Giriş Ekranı) Cizgi Film Effekti
        setTimeout(() => {
            const splashScreen = document.getElementById('splashScreen');
            if (splashScreen) {
                splashScreen.classList.add('fade-out');
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                }, 800);
            }
        }, 3800);

    </script>
</body>
</html>
