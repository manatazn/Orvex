<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orvex - Global Tap to Earn Adventure</title>
    
    <script src='//libtl.com/sdk.js' data-zone='10476542' data-sdk='show_10476542'></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- COPY PROTECTION & GLOBAL STYLES --- */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            
            /* Anti-Copy / Anti-Select Styles */
            -webkit-user-select: none; /* Safari/Chrome */
            -moz-user-select: none;    /* Firefox */
            -ms-user-select: none;     /* IE/Edge */
            user-select: none;         /* Standard */
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        /* --- ADVANCED COSMIC GALAXY THEME --- */
        :root {
            --primary-bg: linear-gradient(135deg, #0c0c2e 0%, #1a1a3d 50%, #2d2d5f 100%);
            --secondary-bg: linear-gradient(135deg, #1e1e3f 0%, #2a2a5a 100%);
            --accent-primary: #00d4ff;
            --accent-secondary: #7c3aed;
            --accent-glow: #00d4ff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(0, 212, 255, 0.2);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-accent: #00d4ff;
            --btn-primary: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            --btn-secondary: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
            --btn-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --btn-warning: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --shadow-primary: 0 20px 40px rgba(0, 212, 255, 0.1);
            --shadow-glow: 0 0 20px rgba(0, 212, 255, 0.3);
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.3);
            --progress-bg: rgba(255, 255, 255, 0.1);
            --progress-fill: linear-gradient(90deg, #00d4ff, #7c3aed);
            --notification-success: linear-gradient(135deg, #10b981, #059669);
            --notification-info: linear-gradient(135deg, #00d4ff, #0099cc);
            --star-color: rgba(255, 255, 255, 0.8);
            --nebula-color: rgba(124, 58, 237, 0.1);
        }

        body.dark-theme {
            --primary-bg: linear-gradient(135deg, #000000 0%, #1a0000 50%, #2d0000 100%);
            --secondary-bg: linear-gradient(135deg, #0a0000 0%, #1a0000 100%);
            --accent-primary: #ff6b6b;
            --accent-secondary: #ffd93d;
            --accent-glow: #ff6b6b;
            --card-bg: rgba(0, 0, 0, 0.7);
            --glass-bg: rgba(0, 0, 0, 0.5);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --text-accent: #ff6b6b;
            --btn-primary: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            --btn-secondary: linear-gradient(135deg, #ffd93d 0%, #fbbf24 100%);
            --shadow-primary: 0 20px 40px rgba(255, 107, 107, 0.1);
            --shadow-glow: 0 0 20px rgba(255, 107, 107, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            position: relative;
            transition: all 0.5s ease;
            cursor: default;
        }

        /* Cosmic Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, var(--star-color), transparent),
                radial-gradient(2px 2px at 40px 70px, var(--star-color), transparent),
                radial-gradient(1px 1px at 90px 40px, var(--star-color), transparent),
                radial-gradient(1px 1px at 130px 80px, var(--star-color), transparent),
                radial-gradient(2px 2px at 160px 30px, var(--star-color), transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: stars 20s linear infinite;
            z-index: -2;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes stars {
            from { transform: translateY(0px); }
            to { transform: translateY(-200px); }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--nebula-color);
            animation: nebula 30s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes nebula {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.1); }
        }

        .container { 
            max-width: 420px; 
            margin: auto; 
            padding: 20px 15px 100px 15px; 
            position: relative;
            z-index: 1;
        } 

        /* Page Transitions */
        .page { 
            display: none; 
            animation: slideInUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
        }
        .page.active { display: block; }
        
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(50px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        /* Balance & Typography */
        h3 { font-family: 'Orbitron', monospace; text-transform: uppercase; }
        .amount { 
            font-family: 'Orbitron', monospace;
            font-size: 36px; 
            font-weight: 900; 
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* --- AIRDROP SPECIFIC STYLES --- */
        .airdrop-header {
            text-align: center;
            margin-bottom: 25px;
            animation: pulseGlow 2s infinite;
        }

        .airdrop-header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }

        .airdrop-header p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3)); }
            50% { filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.7)); }
        }

        .airdrop-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .airdrop-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            animation: orbit 10s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        .airdrop-card > * { position: relative; z-index: 1; }

        .airdrop-balance {
            font-size: 42px;
            font-weight: 900;
            font-family: 'Orbitron', monospace;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .wallet-section {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--glass-border);
        }

        .wallet-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .wallet-input-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: left;
            font-family: 'Orbitron', monospace;
        }

        .wallet-input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--accent-primary);
            color: #fff;
            font-family: 'Inter', monospace;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .wallet-input:focus {
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            border-color: #fff;
        }

        .wallet-input:disabled {
            background: rgba(16, 185, 129, 0.1);
            border-color: #10b981;
            color: #10b981;
            cursor: not-allowed;
            text-align: center;
            font-weight: 700;
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: none;
            font-family: 'Orbitron', monospace;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            box-shadow: var(--shadow-primary);
        }

        .btn-save { background: var(--btn-success); margin-bottom: 15px; }
        .btn-save:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4); }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-telegram { background: linear-gradient(135deg, #0088cc 0%, #005580 100%); display: flex; align-items: center; justify-content: center; gap: 10px;}
        .btn-telegram:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 136, 204, 0.4); }

        .ineligible-card {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.5);
            padding: 40px 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
        }

        .ineligible-icon {
            font-size: 60px;
            color: #ef4444;
            margin-bottom: 20px;
        }

        .ineligible-card h2 {
            font-family: 'Orbitron', monospace;
            color: #fff;
            margin-bottom: 15px;
        }

        .ineligible-card p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Advanced Splash Screen Fixes */
        #splashScreen {
            position: fixed; 
            inset: 0; 
            width: 100vw;
            height: 100vh;
            background: var(--primary-bg);
            z-index: 99999; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
            box-sizing: border-box;
            overflow: hidden;
        }

        .splash-title { 
            font-family: 'Orbitron', monospace;
            font-size: 45px; 
            font-weight: 900; 
            color: var(--accent-primary);
            margin-bottom: 25px;
            animation: epicEntrance 2s ease-out;
            text-shadow: 0 0 30px var(--accent-glow);
            letter-spacing: 2px;
            text-align: center;
        }

        @keyframes epicEntrance {
            0% { opacity: 0; transform: scale(0.5) rotateX(90deg) translateY(50px); }
            50% { opacity: 1; transform: scale(1.1) rotateX(0deg) translateY(0); }
            100% { opacity: 1; transform: scale(1) rotateX(0deg) translateY(0); }
        }

        .splash-loader {
            width: 200px; 
            height: 6px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .splash-fill { 
            height: 100%; 
            width: 0%; 
            background: var(--progress-fill);
            animation: loadProgress 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            border-radius: 6px;
        }

        @keyframes loadProgress { to { width: 100%; } }

        .splash-subtitle {
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
            animation: fadeInUp 1s ease-out 1s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hide Navigation Menu Entirely for Airdrop Phase */
        .navigation { display: none !important; }

        #notification {
            position: fixed;
            top: 30px; 
            left: 50%; 
            transform: translateX(-50%) translateY(-100px);
            background: var(--notification-info);
            color: white; 
            padding: 12px 30px; 
            border-radius: 40px;
            font-weight: 700; 
            z-index: 10001; 
            transition: all 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            box-shadow: var(--shadow-primary);
            max-width: 85%;
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: 13px;
        }
        .notification-show { transform: translateX(-50%) translateY(0) !important; }
        .notification-hide { transform: translateX(-50%) translateY(-100px) !important; opacity: 0; }

        @media (max-width: 480px) {
            .splash-title { font-size: 36px; }
            .airdrop-balance { font-size: 34px; }
        }
    </style>
</head>
<body id="body">

    <div id="splashScreen">
        <div class="splash-title">ORVEX CITY</div>
        <div class="splash-subtitle">Season 1 Conclusion</div>
        <div class="splash-loader">
            <div class="splash-fill"></div>
        </div>
    </div>

    <div id="notification"><span id="notificationText"></span></div>

    <div class="container">
        <div id="homePage" class="page" style="display:none;"></div>
        <div id="cityPage" class="page" style="display:none;"></div>
        <div id="tasksPage" class="page" style="display:none;"></div>
        <div id="codePage" class="page" style="display:none;"></div>
        <div id="listingPage" class="page" style="display:none;"></div>
        <div id="infoPage" class="page" style="display:none;"></div>

        <div id="airdropPage" class="page active">
            
            <div id="airdropContent"></div>

        </div>
    </div>

    <script>
        // --- SECURITY & ANTI-COPY SYSTEM ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('selectstart', event => event.preventDefault());
        document.addEventListener('dragstart', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 'c' || e.key === 'C')) {
                e.preventDefault();
            }
        });

        // --- DATA STORAGE FUNCTIONS ---
        function safeGet(k, d = 0) { 
            try { 
                const item = localStorage.getItem(k);
                return item ? JSON.parse(item) : d; 
            } catch(e) { return d; } 
        }

        function safeSet(k, v) { 
            try { 
                localStorage.setItem(k, JSON.stringify(v)); 
                return true;
            } catch(e) { return false; } 
        }

        // --- GLOBAL GAME STATE ---
        let rawCoins = parseFloat(safeGet('coins', 0)) || 0;
        let upgradeLevel = Math.max(1, parseInt(safeGet('upgradeLevel', 1)) || 1);
        let season1Converted = safeGet('season1Converted', false);
        let savedTonWallet = safeGet('tonWallet', '');

        // --- AIRDROP CONVERSION LOGIC (Silinecek 2 sıfır) ---
        if (!season1Converted) {
            // Balansın son 2 rəqəmini silmək üçün 100-ə bölürük və tam hissəni götürürük
            rawCoins = Math.floor(rawCoins / 100);
            safeSet('coins', rawCoins);
            safeSet('season1Converted', true);
        }

        let airdropCoins = rawCoins;

        function formatNumber(num) {
            return num.toLocaleString();
        }

        function showNotification(msg, duration = 2500, type = 'info') { 
            const notificationEl = document.getElementById('notification');
            const textEl = document.getElementById('notificationText');
            if (!notificationEl || !textEl) return;

            textEl.textContent = msg;
            notificationEl.style.background = type === 'success' ? 'var(--notification-success)' : (type === 'error' ? 'rgba(239, 68, 68, 0.9)' : 'var(--notification-info)');
            
            notificationEl.classList.remove('notification-hide');
            notificationEl.classList.add('notification-show');

            setTimeout(() => {
                notificationEl.classList.remove('notification-show');
                notificationEl.classList.add('notification-hide');
            }, duration);
        }

        // --- RENDER AIRDROP PAGE ---
        function renderAirdropPage() {
            const contentDiv = document.getElementById('airdropContent');
            
            // Şərt: Level 50-ni keçməyənlər
            if (upgradeLevel <= 50) {
                contentDiv.innerHTML = `
                    <div class="ineligible-card">
                        <div class="ineligible-icon"><i class="fas fa-times-circle"></i></div>
                        <h2>NOT ELIGIBLE</h2>
                        <p>Season 1 has concluded. Unfortunately, you did not reach <b>City Level 50</b> to qualify for the Airdrop phase.</p>
                        <p>Don't worry! Prepare yourself for <b>Season 2</b> coming soon.</p>
                    </div>
                `;
                return;
            }

            // Şərt: Level 50-ni keçənlər (Uğurlu)
            const isWalletSaved = savedTonWallet.length > 5;
            
            let walletHTML = '';
            if (isWalletSaved) {
                walletHTML = `
                    <div class="wallet-input-group">
                        <label>Your TON Wallet Address</label>
                        <input type="text" class="wallet-input" value="${savedTonWallet}" disabled>
                    </div>
                    <button class="btn-action btn-save" disabled><i class="fas fa-check-circle"></i> Wallet Saved</button>
                    
                    <button class="btn-action btn-telegram" onclick="window.open('https://t.me/orvex_support', '_blank')">
                        <i class="fab fa-telegram-plane"></i> Send Screenshot to Support
                    </button>
                `;
            } else {
                walletHTML = `
                    <div class="wallet-input-group">
                        <label>Enter TON Network Wallet Address</label>
                        <input type="text" id="tonWalletInput" class="wallet-input" placeholder="e.g. UQ... or EQ..." autocomplete="off">
                        <p style="font-size: 11px; color: #ef4444; margin-top: 5px; text-align:left;">* Caution: Address cannot be changed once saved!</p>
                    </div>
                    <button id="saveWalletBtn" class="btn-action btn-save" onclick="saveWallet()">Save Wallet Address</button>
                `;
            }

            contentDiv.innerHTML = `
                <div class="airdrop-header">
                    <h1>SEASON 1 ENDED</h1>
                    <p>Congratulations! You have successfully completed Season 1. Your balance has been converted to your final Airdrop allocation.</p>
                </div>

                <div class="airdrop-card">
                    <h3>Final Airdrop Balance</h3>
                    <div class="airdrop-balance">
                        <i class="fas fa-gem" style="color: #00d4ff; font-size: 30px;"></i> 
                        ${formatNumber(airdropCoins)}
                    </div>
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">Converted & Verified</p>
                    
                    <div class="wallet-section" id="walletSectionContainer">
                        ${walletHTML}
                    </div>
                </div>
                
                ${!isWalletSaved ? `
                <div style="background: rgba(0,212,255,0.1); padding: 15px; border-radius: 15px; text-align: center; font-size: 13px; color: #fff; border: 1px solid rgba(0,212,255,0.2);">
                    <i class="fas fa-info-circle" style="color: #00d4ff;"></i> To claim your airdrop, save your TON wallet address above, take a screenshot of this entire page, and send it to <b>@orvex_support</b>.
                </div>
                ` : ''}
            `;
        }

        // --- WALLET SAVE LOGIC ---
        window.saveWallet = function() {
            const inputEl = document.getElementById('tonWalletInput');
            const walletVal = inputEl.value.trim();

            if (walletVal.length < 15) {
                showNotification("❌ Please enter a valid TON Wallet address!", 3000, 'error');
                return;
            }

            const confirmSave = confirm("Are you sure this is your correct TON Wallet address?\n\nYou CANNOT change this later!");
            if (confirmSave) {
                safeSet('tonWallet', walletVal);
                savedTonWallet = walletVal;
                showNotification("✅ Wallet address saved successfully!", 3000, 'success');
                renderAirdropPage(); // Re-render to lock the UI
            }
        };

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', function() {
            // Render the Airdrop Screen
            renderAirdropPage();
        });

        // Splash screen handling
        setTimeout(() => {
            const splashScreen = document.getElementById('splashScreen');
            if (splashScreen) {
                splashScreen.style.opacity = '0';
                splashScreen.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                    if (upgradeLevel > 50 && !savedTonWallet) {
                        showNotification("🎉 Congratulations! Please submit your wallet.", 3000, 'success');
                    }
                }, 800);
            }
        }, 3500);

    </script>
</body>
</html>
